<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=Fraunces:opsz,ital,wght@9..144,1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#1F4938;--ink-deep:#0F2D22;--rust:#C2410C;--paper:#FDFBF5;--paper-warm:#F9F3E6;--bg:#F5F1E8;--green:#16A34A;--red:#DC2626;--yellow:#F5D060;--blue:#2563EB}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink-deep);min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:2rem 1.25rem 4rem}
.serif{font-family:'Noto Serif KR',serif}
.display{font-family:'Fraunces',serif;font-style:italic}
.btn{border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:.875rem;font-weight:500;border-radius:1rem;padding:.75rem 1.25rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;transition:all .2s}
.btn-primary{background:var(--ink);color:var(--paper-warm)}.btn-primary:hover{background:var(--ink-deep);transform:translateY(-1px)}.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn-ghost:hover{background:var(--ink);color:var(--paper-warm)}.btn-ghost:disabled{opacity:.3}
.btn-danger{background:#FEF2F2;color:var(--red);border:1.5px solid rgba(220,38,38,.2)}.btn-danger:hover{background:var(--red);color:#fff}
.btn-full{width:100%;padding:1rem 1.25rem;border-radius:1.25rem;font-size:1rem}
.btn-sm{padding:.5rem .875rem;font-size:.8rem;border-radius:.75rem}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid rgba(31,73,56,.15)}
.logo{display:flex;align-items:center;gap:.625rem}
.logo-icon{width:2.25rem;height:2.25rem;background:var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--paper-warm);font-size:1rem}
.logo-label{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);opacity:.6;font-weight:500}
.logo-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:.95rem;color:var(--ink-deep)}
.progress-wrap{margin-bottom:1.5rem}.progress-meta{display:flex;justify-content:space-between;font-size:.75rem;color:rgba(31,73,56,.7);margin-bottom:.5rem}.progress-track{background:rgba(31,73,56,.1);border-radius:999px;height:6px;overflow:hidden}.progress-fill{background:var(--ink);height:100%;border-radius:999px;transition:width .5s}
.mode-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.625rem;margin-bottom:2rem}
.mode-card{background:var(--paper);border:1.5px solid rgba(31,73,56,.12);border-radius:1.25rem;padding:1rem;cursor:pointer;transition:all .25s;text-align:left;font-family:'Noto Sans KR',sans-serif}.mode-card:hover:not(.disabled){border-color:var(--ink);transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(31,73,56,.2)}.mode-card.active{background:var(--ink);color:var(--paper-warm);border-color:var(--ink)}.mode-card.disabled{opacity:.35;cursor:not-allowed}
.mode-icon{font-size:1.25rem;margin-bottom:.5rem}.mode-name{font-family:'Noto Serif KR',serif;font-weight:700;font-size:.875rem;margin-bottom:.2rem}.mode-desc{font-size:.7rem;opacity:.7;line-height:1.4}
.q-card{background:var(--paper);border-radius:1.75rem;padding:1.75rem;margin-bottom:1.25rem;box-shadow:0 1px 0 rgba(31,73,56,.08),0 8px 24px -12px rgba(31,73,56,.15);position:relative}
.q-badge{position:absolute;top:.875rem;right:.875rem;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(31,73,56,.4);font-weight:500}
.q-label{font-size:.7rem;text-transform:uppercase;letter-spacing:.2em;color:rgba(31,73,56,.6);margin-bottom:.75rem}
.q-text{font-family:'Noto Serif KR',serif;font-weight:700;font-size:1.15rem;line-height:1.6;color:var(--ink-deep);white-space:pre-line}
.options{display:flex;flex-direction:column;gap:.625rem;margin-bottom:1.5rem}
.opt{background:var(--paper);border:1.5px solid rgba(31,73,56,.15);border-radius:1.25rem;padding:1rem 1.25rem;cursor:pointer;display:flex;align-items:center;gap:.875rem;transition:all .2s;text-align:left;font-family:'Noto Sans KR',sans-serif;font-size:.875rem;font-weight:500;color:var(--ink-deep);width:100%}.opt:hover:not([disabled]){border-color:var(--ink);transform:translateX(2px)}.opt[disabled]{cursor:not-allowed}.opt.correct{background:#F0FDF4;border-color:var(--green);color:#14532D}.opt.wrong{background:#FEF2F2;border-color:var(--red);color:#7F1D1D}.opt.dimmed{opacity:.4}
.badge{width:1.75rem;height:1.75rem;border-radius:50%;background:rgba(31,73,56,.08);color:var(--ink);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}.badge.g{background:var(--green);color:#fff}.badge.r{background:var(--red);color:#fff}
.feedback{border-radius:1.25rem;padding:1rem 1.25rem;margin-bottom:.75rem;display:flex;gap:.875rem;align-items:flex-start}.feedback.ok{background:#F0FDF4}.feedback.fail{background:#FEF3E8}.fb-icon{width:2rem;height:2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.875rem}.fb-icon.g{background:var(--green);color:#fff}.fb-icon.r{background:var(--rust);color:#fff}.fb-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:.875rem;margin-bottom:.25rem}.fb-title.g{color:#14532D}.fb-title.r{color:#7C2D12}.fb-body{font-size:.8rem;line-height:1.5}.fb-body.g{color:#166534}.fb-body.r{color:#9A3412}
.type-wrap{margin-bottom:1.5rem}.type-input{width:100%;padding:1rem 1.25rem;border:2px solid rgba(31,73,56,.2);border-radius:1.25rem;font-family:'Noto Sans KR',sans-serif;font-size:1.125rem;font-weight:500;background:var(--paper);color:var(--ink-deep);outline:none;transition:border-color .2s}.type-input:focus{border-color:var(--ink)}.type-input.correct-input{border-color:var(--green);background:#F0FDF4}.type-input.wrong-input{border-color:var(--red);background:#FEF2F2}.type-hint{font-size:.75rem;color:rgba(31,73,56,.5);margin-top:.5rem;padding-left:.25rem}.type-row{display:flex;gap:.5rem;margin-top:.75rem}
.flash-wrap{perspective:1400px;margin-bottom:1.5rem}.flash-inner{position:relative;min-height:240px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,0,.2,1);cursor:pointer}.flash-inner.flipped{transform:rotateY(180deg)}.flash-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;position:absolute;inset:0;border-radius:1.75rem;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center}.ff{background:var(--paper);box-shadow:0 2px 0 rgba(31,73,56,.1),0 20px 40px -16px rgba(31,73,56,.2)}.fb-card{background:var(--paper-warm);transform:rotateY(180deg);box-shadow:0 2px 0 rgba(31,73,56,.1),0 20px 40px -16px rgba(31,73,56,.2)}.flash-tag{position:absolute;top:.875rem;right:.875rem;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(31,73,56,.4);font-weight:500}.flash-hint{font-size:.7rem;color:rgba(31,73,56,.4);margin-top:.875rem}.flash-lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.2em;color:rgba(31,73,56,.5);margin-bottom:.75rem}.flash-text{font-family:'Noto Serif KR',serif;font-weight:700;font-size:1.25rem;line-height:1.5;color:var(--ink-deep);white-space:pre-line}.flash-nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem}
.result-hero{background:var(--paper);border-radius:1.75rem;padding:2rem;text-align:center;margin-bottom:1.5rem;box-shadow:0 2px 0 rgba(31,73,56,.1),0 20px 40px -16px rgba(31,73,56,.2)}.result-emoji{font-size:2.5rem;margin-bottom:.75rem}.result-score{font-family:'Fraunces',serif;font-style:italic;font-size:4rem;font-weight:600;line-height:1;color:var(--ink-deep)}.result-sub{font-size:.875rem;color:rgba(31,73,56,.6);margin:.5rem 0 .875rem}.result-msg{font-family:'Noto Serif KR',serif;font-weight:700;font-size:1.125rem}
.wrong-list{background:var(--paper-warm);border-radius:1.25rem;padding:1.25rem;margin-bottom:1.25rem}.wrong-hdr{font-family:'Noto Serif KR',serif;font-weight:700;font-size:.9rem;color:var(--ink-deep);margin-bottom:.875rem}.wrong-items{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem}.wrong-item{background:var(--paper);border-radius:.875rem;padding:.75rem 1rem}.wrong-q{font-size:.875rem;font-weight:600;color:var(--ink-deep)}.wrong-a{font-size:.75rem;color:rgba(31,73,56,.7);margin-top:.15rem}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.section-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:1.1rem;color:var(--ink-deep)}
.hero-eyebrow{font-size:.65rem;letter-spacing:.25em;text-transform:uppercase;color:var(--rust);margin-bottom:.5rem}
.hero-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:2rem;line-height:1.25;color:var(--ink-deep);margin-bottom:.5rem}
.hero-sub{font-size:.875rem;line-height:1.6;color:rgba(31,73,56,.7);margin-bottom:2rem}
.btn-stack{display:flex;flex-direction:column;gap:.625rem}
.menu-card{background:var(--paper);border:2px solid rgba(31,73,56,.1);border-radius:1.5rem;padding:1.5rem;cursor:pointer;transition:all .3s;position:relative}.menu-card:hover{border-color:var(--ink);transform:translateY(-3px);box-shadow:0 16px 32px -16px rgba(31,73,56,.25)}.menu-num{font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(31,73,56,.4);margin-bottom:.5rem}.menu-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:1.1rem;margin-bottom:.375rem;color:var(--ink-deep)}.menu-sub{font-size:.8rem;color:rgba(31,73,56,.6);line-height:1.5}
.empty-state{background:var(--paper);border-radius:1.5rem;padding:2.5rem;text-align:center;border:2px dashed rgba(31,73,56,.15)}.empty-icon{font-size:2rem;margin-bottom:.75rem;opacity:.4}.empty-text{font-family:'Noto Serif KR',serif;font-weight:700;font-size:.95rem;color:var(--ink-deep);margin-bottom:.375rem}.empty-sub{font-size:.8rem;color:rgba(31,73,56,.5);margin-bottom:1.25rem}
.footer{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid rgba(31,73,56,.1);text-align:center;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(31,73,56,.35)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fade-in{animation:fadeIn .3s ease-out}.shake{animation:shake .3s}

/* Edit mode */
.edit-toggle-btn{position:fixed;top:1rem;right:1rem;z-index:100;background:var(--paper);border:1.5px solid rgba(31,73,56,.2);border-radius:1rem;padding:.6rem 1rem;font-family:'Noto Sans KR',sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;color:var(--ink);box-shadow:0 4px 12px -4px rgba(31,73,56,.15);transition:all .2s}.edit-toggle-btn:hover{background:var(--ink);color:var(--paper-warm)}.edit-toggle-btn.active{background:var(--rust);color:#fff;border-color:var(--rust)}
.edit-chapter-card{background:var(--paper);border:1.5px solid rgba(31,73,56,.12);border-radius:1.25rem;padding:1.25rem 1.5rem;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}.edit-chapter-info{flex:1;min-width:0;cursor:pointer}.edit-chapter-name{font-family:'Noto Serif KR',serif;font-weight:700;font-size:1rem;color:var(--ink-deep);margin-bottom:.2rem}.edit-chapter-count{font-size:.75rem;color:rgba(31,73,56,.5)}.edit-chapter-actions{display:flex;gap:.5rem;flex-shrink:0}
.edit-q-row{background:var(--paper);border:1.5px solid rgba(31,73,56,.1);border-radius:1rem;padding:1rem 1.25rem;margin-bottom:.625rem;display:flex;align-items:flex-start;gap:1rem}.edit-q-info{flex:1;min-width:0}.edit-q-type{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.2rem .5rem;border-radius:.375rem;display:inline-block;margin-bottom:.375rem}.type-mc{background:#E0F2FE;color:#0369A1}.type-fi{background:#F0FDF4;color:#166534}.type-fc{background:#FEF3C7;color:#92400E}.edit-q-text{font-size:.875rem;color:var(--ink-deep);line-height:1.5;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.edit-q-actions{display:flex;gap:.4rem;flex-shrink:0;margin-top:.1rem}
.add-btn{width:100%;padding:1rem;border-radius:1.25rem;border:2px dashed rgba(31,73,56,.2);background:transparent;color:rgba(31,73,56,.5);font-family:'Noto Sans KR',sans-serif;font-size:.875rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.5rem}.add-btn:hover{border-color:var(--ink);color:var(--ink);background:var(--paper)}
.modal-overlay{position:fixed;inset:0;background:rgba(15,45,34,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;padding:1rem}
@media(min-width:520px){.modal-overlay{align-items:center}}
.modal{background:var(--paper);border-radius:1.75rem 1.75rem 1rem 1rem;padding:1.75rem;width:100%;max-width:480px;max-height:92vh;overflow-y:auto}
@media(min-width:520px){.modal{border-radius:1.75rem}}
.modal-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:1.1rem;color:var(--ink-deep);margin-bottom:1.25rem}
.form-group{margin-bottom:1rem}
.form-label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.7;margin-bottom:.375rem;display:block}
.form-input{width:100%;padding:.875rem 1rem;border:2px solid rgba(31,73,56,.2);border-radius:1rem;font-family:'Noto Sans KR',sans-serif;font-size:.9rem;background:var(--paper);color:var(--ink-deep);outline:none;transition:border-color .2s;resize:vertical}.form-input:focus{border-color:var(--ink)}.form-input.error{border-color:var(--red)}
.form-error{font-size:.75rem;color:var(--red);margin-top:.375rem}
.type-tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.type-tab{flex:1;padding:.625rem;border-radius:.75rem;border:1.5px solid rgba(31,73,56,.15);background:transparent;font-family:'Noto Sans KR',sans-serif;font-size:.8rem;cursor:pointer;color:rgba(31,73,56,.6);transition:all .2s}.type-tab.active{background:var(--ink);color:var(--paper-warm);border-color:var(--ink)}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem}
.modal-actions{display:flex;gap:.625rem;margin-top:1.5rem}
.back-row{display:flex;align-items:center;gap:.625rem;margin-bottom:1.5rem;cursor:pointer;color:rgba(31,73,56,.6);font-size:.875rem;width:fit-content}.back-row:hover{color:var(--ink)}
.type-badge{font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:.25rem .6rem;border-radius:.5rem;display:inline-flex;align-items:center}
</style>
</head>
<body>
<button class="edit-toggle-btn" id="editToggle">✏️ 편집 모드</button>
<div id="app"></div>
<script>
const app = document.getElementById('app');
const editToggle = document.getElementById('editToggle');

const S = {
  editMode: false,
  // Study
  screen: 'home',
  chapters: [],
  selectedChapter: null,
  studyMode: 'multiple_choice',
  queue: [], idx: 0, opts: [], answered: null,
  score: { ok: 0, total: 0 }, wrong: [], flipped: false, typedVal: '',
  // Edit
  editScreen: 'chapters',
  editChapter: null,
  modal: null,
  modalData: {},
  modalError: '',
};

// ── API ──────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/api' + path, opts);
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error || '오류가 발생했습니다');
  }
  if (res.status === 204) return null;
  return res.json();
}

async function loadContent() {
  const data = await api('GET', '/content');
  S.chapters = data.chapters;
  render();
}

// ── Helpers ──────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function typeName(t) {
  return t === 'multiple_choice' ? '객관식' : t === 'fill_in' ? '빈칸' : '플래시카드';
}

function typeClass(t) {
  return t === 'multiple_choice' ? 'type-mc' : t === 'fill_in' ? 'type-fi' : 'type-fc';
}

function scoreMsg(pct) {
  if (pct === 100) return '완벽해요!';
  if (pct >= 80) return '잘 했어요!';
  if (pct >= 60) return '조금만 더!';
  return '다시 도전해봐요';
}

function scoreEmoji(pct) {
  if (pct === 100) return '🏆';
  if (pct >= 80) return '🎉';
  if (pct >= 60) return '💪';
  return '📚';
}

// ── Render router ────────────────────────────────────────
function render() {
  let html = '';
  if (S.editMode) {
    html = S.editScreen === 'chapters' ? renderEditChapters() : renderEditQuestions();
  } else {
    if (S.screen === 'home') html = renderHome();
    else if (S.screen === 'chapter') html = renderChapterSelect();
    else if (S.screen === 'quiz') html = renderQuiz();
    else if (S.screen === 'fill') html = renderFill();
    else if (S.screen === 'flash') html = renderFlash();
    else if (S.screen === 'results') html = renderResults();
  }
  if (S.modal) html += renderModal();
  app.innerHTML = html;
  attachInputListeners();
  editToggle.className = 'edit-toggle-btn' + (S.editMode ? ' active' : '');
  editToggle.textContent = S.editMode ? '← 학습 모드' : '✏️ 편집 모드';
}

// ── Study screens ────────────────────────────────────────
function renderHome() {
  const chCards = S.chapters.length
    ? S.chapters.map((ch, i) => {
        const counts = { mc: 0, fi: 0, fc: 0 };
        ch.questions.forEach(q => {
          if (q.type === 'multiple_choice') counts.mc++;
          else if (q.type === 'fill_in') counts.fi++;
          else counts.fc++;
        });
        const total = ch.questions.length;
        const sub = total
          ? [counts.mc && `객관식 ${counts.mc}`, counts.fi && `빈칸 ${counts.fi}`, counts.fc && `플래시카드 ${counts.fc}`].filter(Boolean).join(' · ')
          : '문제가 없습니다';
        return `<div class="menu-card fade-in" data-action="go-chapter" data-id="${ch.id}" style="animation-delay:${i*60}ms">
          <div class="menu-num">챕터 ${i + 1}</div>
          <div class="menu-title">${esc(ch.name)}</div>
          <div class="menu-sub">📝 ${total}문제 ${total ? '— ' + sub : ''}</div>
        </div>`;
      }).join('')
    : `<div class="empty-state">
        <div class="empty-icon">📂</div>
        <div class="empty-text">챕터가 없습니다</div>
        <div class="empty-sub">편집 모드에서 챕터와 문제를 추가해보세요</div>
        <button class="btn btn-ghost btn-sm" data-action="toggle-edit">편집 모드 열기</button>
      </div>`;

  return `
    <div class="header">
      <div class="logo">
        <div class="logo-icon">📖</div>
        <div>
          <div class="logo-label">Study App</div>
          <div class="logo-title">나만의 학습 앱</div>
        </div>
      </div>
    </div>
    <div class="hero-eyebrow">챕터를 선택하세요</div>
    <div class="hero-title">무엇을 공부할까요?</div>
    <div class="hero-sub">챕터를 선택하면 학습 방식을 고를 수 있어요.</div>
    <div style="display:flex;flex-direction:column;gap:.625rem">${chCards}</div>
    <div class="footer">편집 모드에서 챕터·문제를 직접 추가할 수 있어요</div>`;
}

function renderChapterSelect() {
  const ch = S.selectedChapter;
  const hasMC = ch.questions.filter(q => q.type === 'multiple_choice').length >= 1;
  const hasFI = ch.questions.filter(q => q.type === 'fill_in').length >= 1;
  const hasFC = ch.questions.filter(q => q.type === 'flashcard').length >= 1;
  const canMC = ch.questions.length >= 4 && hasMC;

  function modeCard(type, icon, name, desc, enabled) {
    const sel = S.studyMode === type;
    const dis = !enabled;
    return `<div class="mode-card${sel ? ' active' : ''}${dis ? ' disabled' : ''}" data-action="${dis ? '' : 'select-mode'}" data-mode="${type}" title="${dis ? '문제 수가 부족합니다' : ''}">
      <div class="mode-icon">${icon}</div>
      <div class="mode-name">${name}</div>
      <div class="mode-desc">${desc}${dis ? '<br><span style="color:var(--rust);font-size:.65rem">문제 부족</span>' : ''}</div>
    </div>`;
  }

  const total = ch.questions.length;
  return `
    <div class="header">
      <div class="back-row" data-action="go-home">
        <span>←</span><span>전체 목록</span>
      </div>
    </div>
    <div class="hero-eyebrow">챕터 선택</div>
    <div class="hero-title">${esc(ch.name)}</div>
    <div class="hero-sub">총 ${total}문제 · 학습 방식을 선택하세요</div>
    ${total === 0 ? `<div class="empty-state">
      <div class="empty-icon">🤔</div>
      <div class="empty-text">문제가 없어요</div>
      <div class="empty-sub">편집 모드에서 문제를 추가해보세요</div>
      <button class="btn btn-ghost btn-sm" data-action="toggle-edit">편집 모드 열기</button>
    </div>` : `
    <div class="mode-grid">
      ${modeCard('multiple_choice', '🔤', '객관식', '4지선다 퀴즈', canMC)}
      ${modeCard('fill_in', '✏️', '빈칸 채우기', '직접 입력', hasFI)}
      ${modeCard('flashcard', '🃏', '플래시카드', '카드 뒤집기', hasFC)}
    </div>
    <button class="btn btn-primary btn-full" data-action="start-study">학습 시작 →</button>`}`;
}

function buildQueue() {
  const ch = S.selectedChapter;
  const type = S.studyMode;
  let qs = ch.questions.filter(q => q.type === type);
  S.queue = shuffle(qs);
  S.idx = 0;
  S.score = { ok: 0, total: qs.length };
  S.wrong = [];
  S.answered = null;
  S.flipped = false;
  S.typedVal = '';
}

function makeOpts(q) {
  const ch = S.selectedChapter;
  const pool = ch.questions.filter(x => x.id !== q.id).map(x => x.answer);
  const distractors = shuffle(pool).slice(0, 3);
  while (distractors.length < 3) distractors.push('—');
  return shuffle([q.answer, ...distractors]);
}

function renderQuiz() {
  const q = S.queue[S.idx];
  if (!q) return renderResults();
  if (!S.opts.length) S.opts = q.options && q.options.length === 4 ? shuffle(q.options) : makeOpts(q);
  const pct = Math.round(((S.idx) / S.score.total) * 100);
  const opts = S.opts.map((o, i) => {
    let cls = '';
    if (S.answered !== null) {
      if (o === q.answer) cls = 'correct';
      else if (o === S.answered && o !== q.answer) cls = 'wrong';
      else cls = 'dimmed';
    }
    return `<button class="opt ${cls}" data-action="answer" data-val="${esc(o)}" ${S.answered !== null ? 'disabled' : ''}>
      <div class="badge${cls === 'correct' ? ' g' : cls === 'wrong' ? ' r' : ''}">${'ABCD'[i]}</div>
      <span>${esc(o)}</span>
    </button>`;
  }).join('');

  const feedback = S.answered !== null
    ? `<div class="feedback ${S.answered === q.answer ? 'ok' : 'fail'}">
        <div class="fb-icon ${S.answered === q.answer ? 'g' : 'r'}">${S.answered === q.answer ? '✓' : '✗'}</div>
        <div>
          <div class="fb-title ${S.answered === q.answer ? 'g' : 'r'}">${S.answered === q.answer ? '정답!' : '오답'}</div>
          <div class="fb-body ${S.answered === q.answer ? 'g' : 'r'}">${S.answered !== q.answer ? '정답: ' + esc(q.answer) + '<br>' : ''}${q.explanation ? esc(q.explanation) : ''}</div>
        </div>
      </div>` : '';

  return `
    <div class="progress-wrap">
      <div class="progress-meta"><span>${S.idx + 1} / ${S.score.total}</span><span>${pct}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-card">
      <div class="q-badge">${esc(S.selectedChapter.name)}</div>
      <div class="q-label">문제</div>
      <div class="q-text">${esc(q.question)}</div>
    </div>
    <div class="options">${opts}</div>
    ${feedback}
    ${S.answered !== null ? `<button class="btn btn-primary btn-full" data-action="next-quiz">${S.idx + 1 < S.score.total ? '다음 문제 →' : '결과 보기'}</button>` : ''}`;
}

function renderFill() {
  const q = S.queue[S.idx];
  if (!q) return renderResults();
  const pct = Math.round((S.idx / S.score.total) * 100);
  let inputCls = '';
  if (S.answered === 'ok') inputCls = 'correct-input';
  else if (S.answered === 'fail') inputCls = 'wrong-input';

  const feedback = S.answered === 'ok'
    ? `<div class="feedback ok"><div class="fb-icon g">✓</div><div><div class="fb-title g">정답!</div>${q.explanation ? `<div class="fb-body g">${esc(q.explanation)}</div>` : ''}</div></div>`
    : S.answered === 'fail'
    ? `<div class="feedback fail"><div class="fb-icon r">✗</div><div><div class="fb-title r">오답</div><div class="fb-body r">정답: ${esc(q.answer)}${q.explanation ? '<br>' + esc(q.explanation) : ''}</div></div></div>`
    : '';

  return `
    <div class="progress-wrap">
      <div class="progress-meta"><span>${S.idx + 1} / ${S.score.total}</span><span>${pct}%</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="q-card">
      <div class="q-badge">${esc(S.selectedChapter.name)}</div>
      <div class="q-label">빈칸 채우기</div>
      <div class="q-text">${esc(q.question)}</div>
    </div>
    <div class="type-wrap">
      <input class="type-input ${inputCls}" id="fillInput" type="text" placeholder="정답을 입력하세요" value="${esc(S.typedVal)}" ${S.answered ? 'disabled' : ''} autocomplete="off">
      <div class="type-hint">Enter 또는 제출 버튼을 누르세요</div>
      ${!S.answered ? `<div class="type-row">
        <button class="btn btn-primary" data-action="submit-fill">제출</button>
      </div>` : ''}
    </div>
    ${feedback}
    ${S.answered ? `<button class="btn btn-primary btn-full" data-action="next-quiz">${S.idx + 1 < S.score.total ? '다음 문제 →' : '결과 보기'}</button>` : ''}`;
}

function renderFlash() {
  const q = S.queue[S.idx];
  if (!q) { S.screen = 'results'; return renderResults(); }
  return `
    <div class="progress-wrap">
      <div class="progress-meta"><span>${S.idx + 1} / ${S.queue.length}</span><span>${esc(S.selectedChapter.name)}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(((S.idx+1)/S.queue.length)*100)}%"></div></div>
    </div>
    <div class="flash-wrap">
      <div class="flash-inner${S.flipped ? ' flipped' : ''}" data-action="flip">
        <div class="flash-face ff">
          <div class="flash-tag">앞면 · 클릭해서 뒤집기</div>
          <div class="flash-lbl">문제</div>
          <div class="flash-text">${esc(q.question)}</div>
          <div class="flash-hint">탭하여 정답 확인</div>
        </div>
        <div class="flash-face fb-card">
          <div class="flash-tag">뒷면</div>
          <div class="flash-lbl">정답</div>
          <div class="flash-text">${esc(q.answer)}</div>
        </div>
      </div>
    </div>
    <div class="flash-nav">
      <button class="btn btn-ghost" data-action="prev-flash" ${S.idx === 0 ? 'disabled' : ''}>← 이전</button>
      <button class="btn btn-ghost" data-action="flip">뒤집기</button>
      <button class="btn btn-primary" data-action="next-flash">${S.idx + 1 < S.queue.length ? '다음 →' : '완료'}</button>
    </div>`;
}

function renderResults() {
  const { ok, total } = S.score;
  const pct = total ? Math.round((ok / total) * 100) : 100;
  const isFlash = S.studyMode === 'flashcard';

  const wrongHtml = S.wrong.length
    ? `<div class="wrong-list">
        <div class="wrong-hdr">틀린 문제 (${S.wrong.length}개)</div>
        <div class="wrong-items">${S.wrong.map(q => `<div class="wrong-item">
          <div class="wrong-q">${esc(q.question.split('\n')[0])}</div>
          <div class="wrong-a">정답: ${esc(q.answer)}</div>
        </div>`).join('')}</div>
      </div>` : '';

  return `
    <div class="result-hero">
      <div class="result-emoji">${isFlash ? '🃏' : scoreEmoji(pct)}</div>
      ${isFlash ? `<div class="result-score">${S.queue.length}</div>
      <div class="result-sub">장 학습 완료</div>
      <div class="result-msg">플래시카드 완료!</div>`
      : `<div class="result-score">${pct}%</div>
      <div class="result-sub">${ok}개 정답 / ${total}문제</div>
      <div class="result-msg">${scoreMsg(pct)}</div>`}
    </div>
    ${wrongHtml}
    <div class="btn-stack">
      ${!isFlash && S.wrong.length ? `<button class="btn btn-ghost btn-full" data-action="retry-wrong">틀린 문제만 다시 풀기</button>` : ''}
      <button class="btn btn-ghost btn-full" data-action="restart">같은 챕터 다시</button>
      <button class="btn btn-primary btn-full" data-action="go-home">챕터 목록으로</button>
    </div>`;
}

// ── Modal ────────────────────────────────────────────────
function renderModal() {
  if (S.modal === 'chapter') return renderChapterModal();
  if (S.modal === 'question') return renderQuestionModal();
  return '';
}

function renderChapterModal() {
  const isEdit = !!S.modalData.id;
  return `<div class="modal-overlay" data-action="modal-backdrop">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">${isEdit ? '챕터 이름 수정' : '새 챕터 추가'}</div>
      <div class="form-group">
        <label class="form-label">챕터 이름</label>
        <input class="form-input${S.modalError ? ' error' : ''}" id="modalChapterName" type="text" placeholder="예) Chapter 1 · 기초 개념" value="${esc(S.modalData.name || '')}">
        ${S.modalError ? `<div class="form-error">${esc(S.modalError)}</div>` : ''}
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" style="flex:1" data-action="modal-cancel">취소</button>
        <button class="btn btn-primary" style="flex:2" data-action="modal-save-chapter">${isEdit ? '저장' : '추가'}</button>
      </div>
    </div>
  </div>`;
}

function renderQuestionModal() {
  const d = S.modalData;
  const type = d.type || 'multiple_choice';
  const isEdit = !!d.id;

  const typeTabs = ['multiple_choice', 'fill_in', 'flashcard'].map(t =>
    `<button class="type-tab${type === t ? ' active' : ''}" data-action="modal-type" data-type="${t}">${typeName(t)}</button>`
  ).join('');

  let optFields = '';
  if (type === 'multiple_choice') {
    const opts = d.options || ['', '', '', ''];
    const letters = ['A', 'B', 'C', 'D'];
    optFields = `
      <div class="form-group">
        <label class="form-label">보기</label>
        <div class="opts-grid">
          ${opts.map((o, i) => `<input class="form-input" id="opt${i}" type="text" placeholder="보기 ${letters[i]}" value="${esc(o)}">`).join('')}
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">정답 선택</label>
        <select class="form-input" id="modalAnswer">
          <option value="">-- 선택 --</option>
          ${opts.map((o, i) => `<option value="${esc(o)}" ${d.answer === o ? 'selected' : ''}>${letters[i]}. ${esc(o)}</option>`).join('')}
        </select>
      </div>`;
  } else {
    optFields = `
      <div class="form-group">
        <label class="form-label">${type === 'flashcard' ? '뒷면 (정답)' : '정답'}</label>
        <input class="form-input" id="modalAnswer" type="text" placeholder="${type === 'flashcard' ? '카드 뒷면에 표시될 내용' : '정답을 입력하세요'}" value="${esc(d.answer || '')}">
      </div>`;
  }

  const explField = type !== 'flashcard'
    ? `<div class="form-group">
        <label class="form-label">해설 / 힌트 (선택)</label>
        <textarea class="form-input" id="modalExplanation" rows="2" placeholder="틀렸을 때 보여줄 해설이나 힌트">${esc(d.explanation || '')}</textarea>
      </div>` : '';

  return `<div class="modal-overlay" data-action="modal-backdrop">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-title">${isEdit ? '문제 수정' : '새 문제 추가'}</div>
      <div class="form-group">
        <label class="form-label">문제 유형</label>
        <div class="type-tabs">${typeTabs}</div>
      </div>
      <div class="form-group">
        <label class="form-label">${type === 'flashcard' ? '앞면 (문제)' : '문제'}</label>
        <textarea class="form-input" id="modalQuestion" rows="3" placeholder="${type === 'flashcard' ? '카드 앞면에 표시될 내용' : '문제를 입력하세요'}">${esc(d.question || '')}</textarea>
        ${S.modalError ? `<div class="form-error">${esc(S.modalError)}</div>` : ''}
      </div>
      ${optFields}
      ${explField}
      <div class="modal-actions">
        <button class="btn btn-ghost" style="flex:1" data-action="modal-cancel">취소</button>
        <button class="btn btn-primary" style="flex:2" data-action="modal-save-question">${isEdit ? '저장' : '추가'}</button>
      </div>
    </div>
  </div>`;
}

// ── Event delegation ─────────────────────────────────────
app.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (!action) return;

  try {
    if (action === 'toggle-edit') {
      S.editMode = !S.editMode;
      S.editScreen = 'chapters';
      S.modal = null;
      render();

    } else if (action === 'go-home') {
      S.screen = 'home'; render();

    } else if (action === 'go-chapter') {
      const ch = S.chapters.find(c => c.id === el.dataset.id);
      if (!ch) return;
      S.selectedChapter = ch;
      S.screen = 'chapter';
      S.studyMode = 'multiple_choice';
      render();

    } else if (action === 'select-mode') {
      S.studyMode = el.dataset.mode; render();

    } else if (action === 'start-study') {
      buildQueue();
      S.screen = S.studyMode === 'multiple_choice' ? 'quiz' : S.studyMode === 'fill_in' ? 'fill' : 'flash';
      render();

    } else if (action === 'answer') {
      if (S.answered !== null) return;
      const val = el.dataset.val;
      const q = S.queue[S.idx];
      S.answered = val;
      if (val === q.answer) S.score.ok++;
      else S.wrong.push(q);
      render();

    } else if (action === 'submit-fill') {
      submitFill();

    } else if (action === 'next-quiz') {
      S.idx++;
      S.answered = null;
      S.opts = [];
      S.typedVal = '';
      if (S.idx >= S.score.total) S.screen = 'results';
      render();

    } else if (action === 'flip') {
      S.flipped = !S.flipped; render();

    } else if (action === 'next-flash') {
      S.idx++;
      S.flipped = false;
      if (S.idx >= S.queue.length) { S.screen = 'results'; }
      render();

    } else if (action === 'prev-flash') {
      if (S.idx > 0) { S.idx--; S.flipped = false; render(); }

    } else if (action === 'retry-wrong') {
      S.queue = shuffle(S.wrong);
      S.idx = 0; S.score = { ok: 0, total: S.wrong.length };
      S.wrong = []; S.answered = null; S.opts = []; S.typedVal = '';
      S.screen = S.studyMode === 'fill_in' ? 'fill' : 'quiz';
      render();

    } else if (action === 'restart') {
      buildQueue();
      S.screen = S.studyMode === 'multiple_choice' ? 'quiz' : S.studyMode === 'fill_in' ? 'fill' : 'flash';
      render();

    // ── Edit actions ──────────────────────────────────────
    } else if (action === 'open-chapter') {
      S.editChapter = S.chapters.find(c => c.id === el.dataset.id);
      S.editScreen = 'questions';
      render();

    } else if (action === 'back-to-chapters') {
      S.editScreen = 'chapters'; S.editChapter = null; render();

    } else if (action === 'add-chapter-modal') {
      S.modal = 'chapter'; S.modalData = {}; S.modalError = ''; render();

    } else if (action === 'rename-chapter') {
      S.modal = 'chapter';
      S.modalData = { id: el.dataset.id, name: el.dataset.name };
      S.modalError = ''; render();

    } else if (action === 'delete-chapter') {
      if (!confirm(`"${el.dataset.name}" 챕터와 모든 문제를 삭제할까요?`)) return;
      await api('DELETE', `/chapters/${el.dataset.id}`);
      await loadContent();
      S.editScreen = 'chapters';
      render();

    } else if (action === 'add-question-modal') {
      S.modal = 'question';
      S.modalData = { type: 'multiple_choice', options: ['', '', '', ''] };
      S.modalError = ''; render();

    } else if (action === 'edit-question') {
      const ch = S.editChapter;
      const q = ch.questions.find(x => x.id === el.dataset.id);
      S.modal = 'question';
      S.modalData = { ...q, options: q.options ? [...q.options] : ['', '', '', ''] };
      S.modalError = ''; render();

    } else if (action === 'delete-question') {
      if (!confirm('이 문제를 삭제할까요?')) return;
      await api('DELETE', `/questions/${el.dataset.id}`);
      await loadContent();
      S.editChapter = S.chapters.find(c => c.id === S.editChapter.id);
      render();

    } else if (action === 'modal-type') {
      S.modalData = { type: el.dataset.type, options: ['', '', '', ''] };
      S.modalError = ''; render();

    } else if (action === 'modal-cancel' || action === 'modal-backdrop') {
      S.modal = null; S.modalError = ''; render();

    } else if (action === 'modal-save-chapter') {
      const nameEl = document.getElementById('modalChapterName');
      const name = nameEl?.value.trim();
      if (!name) { S.modalError = '챕터 이름을 입력해 주세요'; render(); return; }
      if (S.modalData.id) {
        await api('PUT', `/chapters/${S.modalData.id}`, { name });
      } else {
        await api('POST', '/chapters', { name });
      }
      S.modal = null; S.modalError = '';
      await loadContent();
      render();

    } else if (action === 'modal-save-question') {
      const body = collectQuestionForm();
      if (!body) return;
      if (S.modalData.id) {
        await api('PUT', `/questions/${S.modalData.id}`, body);
      } else {
        await api('POST', `/chapters/${S.editChapter.id}/questions`, body);
      }
      S.modal = null; S.modalError = '';
      await loadContent();
      S.editChapter = S.chapters.find(c => c.id === S.editChapter.id);
      render();
    }
  } catch (err) {
    S.modalError = err.message;
    render();
  }
});

editToggle.addEventListener('click', () => {
  S.editMode = !S.editMode;
  S.editScreen = 'chapters';
  S.modal = null;
  render();
});

function collectQuestionForm() {
  const type = S.modalData.type || 'multiple_choice';
  const question = document.getElementById('modalQuestion')?.value.trim();
  const answerEl = document.getElementById('modalAnswer');
  let answer = answerEl?.value.trim();
  let options;

  if (!question) { S.modalError = '문제 내용을 입력해 주세요'; render(); return null; }
  if (!answer) { S.modalError = '정답을 입력해 주세요'; render(); return null; }

  if (type === 'multiple_choice') {
    options = [0,1,2,3].map(i => document.getElementById('opt' + i)?.value.trim() || '');
    if (options.some(o => !o)) { S.modalError = '보기 4개를 모두 입력해 주세요'; render(); return null; }
    answer = answerEl?.value;
    if (!answer || answer === '') { S.modalError = '정답을 선택해 주세요'; render(); return null; }
  }

  const explanation = document.getElementById('modalExplanation')?.value.trim() || '';
  const body = { type, question, answer };
  if (options) body.options = options;
  if (explanation) body.explanation = explanation;
  return body;
}

function submitFill() {
  if (S.answered) return;
  const inp = document.getElementById('fillInput');
  const val = inp?.value.trim() || S.typedVal.trim();
  const q = S.queue[S.idx];
  S.typedVal = val;
  if (!val) return;
  const correct = val.toLowerCase() === q.answer.toLowerCase();
  S.answered = correct ? 'ok' : 'fail';
  if (correct) S.score.ok++;
  else S.wrong.push(q);
  render();
}

function attachInputListeners() {
  const fill = document.getElementById('fillInput');
  if (fill) {
    fill.addEventListener('input', e => { S.typedVal = e.target.value; });
    fill.addEventListener('keydown', e => { if (e.key === 'Enter') submitFill(); });
    if (!S.answered) setTimeout(() => fill.focus(), 50);
  }
  // Update MC answer select when option inputs change
  [0,1,2,3].forEach(i => {
    const el = document.getElementById('opt' + i);
    if (el) el.addEventListener('input', () => {
      const sel = document.getElementById('modalAnswer');
      if (!sel) return;
      const opts = [0,1,2,3].map(j => document.getElementById('opt'+j)?.value || '');
      const letters = ['A','B','C','D'];
      sel.innerHTML = `<option value="">-- 선택 --</option>` +
        opts.map((o, j) => `<option value="${esc(o)}">${letters[j]}. ${esc(o)}</option>`).join('');
    });
  });
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

loadContent();
</script>
