<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>TabNet decision step 내부</title>
  <desc>하나의 decision step 안에서 attentive transformer가 이전 step의 특징과 prior scale로 sparsemax 마스크를 만들고, 선택된 피처가 feature transformer를 거쳐 split되어 일부는 출력에, 일부는 다음 step으로 간다.</desc>
  <rect x="0" y="0" width="900" height="340" rx="14" fill="#faf9f6"/>

  <!-- Attentive transformer -->
  <rect x="30" y="40" width="230" height="150" rx="10" fill="#c2683f" opacity="0.07" stroke="#c2683f"/>
  <text x="145" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#c2683f">Attentive Transformer</text>
  <g font-size="11" fill="#2b2823">
    <rect x="55" y="78" width="180" height="24" rx="6" fill="#fff" stroke="#c9c4ba"/><text x="145" y="94" text-anchor="middle">FC → BN</text>
    <rect x="55" y="110" width="180" height="24" rx="6" fill="#fff" stroke="#c9c4ba"/><text x="145" y="126" text-anchor="middle">× Prior scale P[i-1]</text>
    <rect x="55" y="142" width="180" height="24" rx="6" fill="#fff" stroke="#c2683f"/><text x="145" y="158" text-anchor="middle" font-weight="700">Sparsemax → Mask M[i]</text>
  </g>

  <!-- Feature transformer -->
  <rect x="360" y="40" width="240" height="150" rx="10" fill="#3b6ea5" opacity="0.07" stroke="#3b6ea5"/>
  <text x="480" y="62" text-anchor="middle" font-size="13" font-weight="700" fill="#3b6ea5">Feature Transformer</text>
  <g font-size="10.5" fill="#2b2823">
    <rect x="380" y="78" width="200" height="22" rx="6" fill="#fff" stroke="#c9c4ba"/><text x="480" y="93" text-anchor="middle">FC → BN → GLU (shared) ×2</text>
    <rect x="380" y="106" width="200" height="22" rx="6" fill="#fff" stroke="#c9c4ba"/><text x="480" y="121" text-anchor="middle">FC → BN → GLU (step별) ×2</text>
    <rect x="380" y="140" width="200" height="26" rx="6" fill="#3b6ea5" opacity="0.15" stroke="#3b6ea5"/><text x="480" y="157" text-anchor="middle" font-weight="700">Split</text>
  </g>
  <text x="480" y="182" text-anchor="middle" font-size="9.5" fill="#6b655c">잔차 연결 + √0.5 스케일</text>

  <!-- masked features box -->
  <rect x="285" y="95" width="55" height="40" rx="6" fill="#c2683f" opacity="0.15" stroke="#c2683f"/>
  <text x="312" y="112" text-anchor="middle" font-size="9" fill="#2b2823">선택된</text>
  <text x="312" y="124" text-anchor="middle" font-size="9" fill="#2b2823">피처</text>

  <!-- arrows -->
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#6b655c"/></marker>
  </defs>
  <g stroke="#6b655c" stroke-width="1.4" fill="none" marker-end="url(#a1)">
    <path d="M260 130 L 283 115"/>
    <path d="M340 115 L 358 115"/>
  </g>
  <text x="312" y="150" text-anchor="middle" font-size="9" fill="#6b655c">M ⊙ features</text>

  <!-- split outputs -->
  <g stroke="#3b6ea5" stroke-width="1.5" fill="none" marker-end="url(#a2)">
    <path d="M600 150 L 690 90"/>
    <path d="M600 158 L 690 230"/>
  </g>
  <defs>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#3b6ea5"/></marker>
  </defs>
  <rect x="695" y="65" width="175" height="50" rx="8" fill="#3b6ea5" opacity="0.12" stroke="#3b6ea5"/>
  <text x="782" y="86" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2823">ReLU → 출력 기여</text>
  <text x="782" y="103" text-anchor="middle" font-size="10" fill="#6b655c">(Σ 로 합산)</text>

  <rect x="695" y="205" width="175" height="50" rx="8" fill="#c2683f" opacity="0.10" stroke="#c2683f"/>
  <text x="782" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#2b2823">다음 step의</text>
  <text x="782" y="243" text-anchor="middle" font-size="10" fill="#6b655c">Attentive 입력으로</text>

  <!-- feedback to prior -->
  <path d="M782 255 C 782 300, 145 320, 145 192" stroke="#c2683f" stroke-width="1.3" fill="none" stroke-dasharray="5 4" marker-end="url(#a3)"/>
  <defs>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#c2683f"/></marker>
  </defs>
  <text x="450" y="322" text-anchor="middle" font-size="10" fill="#c2683f">Prior 갱신: P[i] = Π (γ − M[j]) — γ 클수록 피처 재사용 허용</text>
</svg>
