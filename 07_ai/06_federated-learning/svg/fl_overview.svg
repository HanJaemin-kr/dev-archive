<svg viewBox="0 0 840 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>연합학습 기본 구조</title>
  <desc>중앙 서버가 글로벌 모델을 각 클라이언트에 배포하고, 클라이언트는 원본 데이터를 반출하지 않은 채 로컬 학습 후 모델 업데이트만 서버로 보내며, 서버는 이를 집계해 글로벌 모델을 갱신한다.</desc>
  <defs>
    <marker id="arrow-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#4a7c59"/></marker>
    <marker id="arrow-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2683f"/></marker>
  </defs>
  <rect x="0" y="0" width="840" height="330" rx="14" fill="#faf9f6"/>

  <!-- 중앙 서버 -->
  <rect x="300" y="28" width="240" height="64" rx="10" fill="#eef2ea" stroke="#4a7c59" stroke-width="1.6"/>
  <text x="420" y="53" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2823">중앙 서버 · 글로벌 모델 W</text>
  <text x="420" y="76" text-anchor="middle" font-size="11.5" fill="#6b655c">④ 집계 W ← Σ (nₖ/n)·Wₖ</text>

  <!-- 배포(초록, 아래 방향) / 업로드(주황, 위 방향) -->
  <line x1="352" y1="92" x2="150" y2="164" stroke="#4a7c59" stroke-width="1.6" marker-end="url(#arrow-g)"/>
  <line x1="190" y1="164" x2="386" y2="94" stroke="#c2683f" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-o)"/>
  <line x1="404" y1="92" x2="404" y2="164" stroke="#4a7c59" stroke-width="1.6" marker-end="url(#arrow-g)"/>
  <line x1="438" y1="164" x2="438" y2="94" stroke="#c2683f" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-o)"/>
  <line x1="488" y1="92" x2="690" y2="164" stroke="#4a7c59" stroke-width="1.6" marker-end="url(#arrow-g)"/>
  <line x1="650" y1="164" x2="454" y2="94" stroke="#c2683f" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrow-o)"/>
  <text x="212" y="112" font-size="11" fill="#4a7c59">① 글로벌 모델 배포</text>
  <text x="452" y="136" font-size="11" fill="#c2683f">③ 업데이트 ΔWₖ만 업로드</text>

  <!-- 클라이언트 3곳 -->
  <g>
    <rect x="55" y="166" width="210" height="96" rx="10" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.4"/>
    <text x="160" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2823">클라이언트 A</text>
    <text x="160" y="210" text-anchor="middle" font-size="11" fill="#6b655c">특정 고장 클래스 편중</text>
    <text x="160" y="232" text-anchor="middle" font-size="11" fill="#4a7c59">② 로컬 학습 (자체 데이터)</text>
    <text x="160" y="251" text-anchor="middle" font-size="10.5" fill="#b3543a">🔒 원본 데이터 반출 없음</text>
  </g>
  <g>
    <rect x="315" y="166" width="210" height="96" rx="10" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.4"/>
    <text x="420" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2823">클라이언트 B</text>
    <text x="420" y="210" text-anchor="middle" font-size="11" fill="#6b655c">설비·센서 특성 상이</text>
    <text x="420" y="232" text-anchor="middle" font-size="11" fill="#4a7c59">② 로컬 학습 (자체 데이터)</text>
    <text x="420" y="251" text-anchor="middle" font-size="10.5" fill="#b3543a">🔒 원본 데이터 반출 없음</text>
  </g>
  <g>
    <rect x="575" y="166" width="210" height="96" rx="10" fill="#ffffff" stroke="#c9c2b6" stroke-width="1.4"/>
    <text x="680" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#2b2823">클라이언트 C</text>
    <text x="680" y="210" text-anchor="middle" font-size="11" fill="#6b655c">데이터 소량</text>
    <text x="680" y="232" text-anchor="middle" font-size="11" fill="#4a7c59">② 로컬 학습 (자체 데이터)</text>
    <text x="680" y="251" text-anchor="middle" font-size="10.5" fill="#b3543a">🔒 원본 데이터 반출 없음</text>
  </g>

  <text x="420" y="300" text-anchor="middle" font-size="11.5" fill="#6b655c">원본 데이터는 각 클라이언트를 떠나지 않고, 모델 업데이트만 교환하며 ①→②→③→④ 라운드를 반복한다</text>
</svg>
