<svg viewBox="0 0 760 280" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>뾰족한 최적점 vs 평탄한 최적점</title>
  <desc>클라이언트마다 손실 지형이 조금씩 어긋날 때, 뾰족한 최적점에서는 공통 모델의 손실이 급등하지만 평탄한 최적점에서는 여전히 낮게 유지된다.</desc>
  <rect x="0" y="0" width="760" height="280" rx="14" fill="#faf9f6"/>
  <line x1="380" y1="40" x2="380" y2="235" stroke="#e0dbd2" stroke-width="1.5"/>

  <!-- LEFT: sharp -->
  <text x="190" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2b2823">Sharp Minima</text>
  <path d="M70,70 Q150,320 230,70" fill="none" stroke="#4a7c59" stroke-width="2"/>
  <path d="M110,70 Q190,320 270,70" fill="none" stroke="#c2683f" stroke-width="2"/>
  <line x1="170" y1="70" x2="170" y2="215" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="170" cy="141" r="5" fill="#b3543a"/>
  <text x="182" y="120" font-size="11" fill="#b3543a">공통 모델 w̄ → 손실 급등</text>
  <text x="118" y="238" font-size="10.5" fill="#4a7c59">클라이언트 A 손실</text>
  <text x="212" y="238" font-size="10.5" fill="#c2683f">클라이언트 B 손실</text>
  <text x="190" y="262" text-anchor="middle" font-size="11" fill="#6b655c">분포가 조금만 어긋나도 어느 쪽에도 안 맞음</text>

  <!-- RIGHT: flat -->
  <text x="570" y="32" text-anchor="middle" font-size="13.5" font-weight="700" fill="#2b2823">Flat Minima (SAM 계열)</text>
  <path d="M420,70 C445,185 470,202 545,202 C620,202 645,185 670,70" fill="none" stroke="#4a7c59" stroke-width="2"/>
  <path d="M450,70 C475,190 500,208 575,208 C650,208 675,190 700,70" fill="none" stroke="#c2683f" stroke-width="2"/>
  <line x1="560" y1="70" x2="560" y2="215" stroke="#8a8377" stroke-width="1.2" stroke-dasharray="4 3"/>
  <circle cx="560" cy="205" r="5" fill="#4a7c59"/>
  <text x="572" y="188" font-size="11" fill="#4a7c59">w̄ 에서도 둘 다 낮음</text>
  <text x="570" y="262" text-anchor="middle" font-size="11" fill="#6b655c">평탄한 지점에서는 분포가 조금 달라도 둘 다 낮음</text>
</svg>
