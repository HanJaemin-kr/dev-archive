<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>선형 평균의 한계 — 손실 장벽</title>
  <desc>두 현장의 최적 모델을 잇는 선형 보간 경로에서 손실이 솟아오르는 손실 장벽이 생기면, 단순 평균한 모델은 어느 현장에도 맞지 않는 고손실 지점에 놓인다.</desc>
  <rect x="0" y="0" width="760" height="300" rx="14" fill="#faf9f6"/>

  <!-- 축 -->
  <line x1="80" y1="240" x2="690" y2="240" stroke="#8a8377" stroke-width="1.4"/>
  <line x1="80" y1="60" x2="80" y2="240" stroke="#8a8377" stroke-width="1.4"/>
  <text x="70" y="55" text-anchor="end" font-size="11" fill="#6b655c">손실</text>
  <text x="385" y="288" text-anchor="middle" font-size="11" fill="#6b655c">보간 계수 α  ·  W(α) = (1−α)·W_A + α·W_B</text>
  <text x="110" y="258" text-anchor="middle" font-size="11" fill="#6b655c">α=0</text>
  <text x="385" y="258" text-anchor="middle" font-size="11" fill="#6b655c">α=0.5</text>
  <text x="660" y="258" text-anchor="middle" font-size="11" fill="#6b655c">α=1</text>

  <!-- 개별 모델 손실 수준 -->
  <line x1="80" y1="205" x2="690" y2="205" stroke="#c9c2b6" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="686" y="198" text-anchor="end" font-size="10.5" fill="#8a8377">개별 현장 모델의 손실 수준</text>

  <!-- 손실 장벽 곡선 -->
  <path d="M110,205 C200,205 290,95 385,95 C480,95 570,208 660,208" fill="none" stroke="#c2683f" stroke-width="2.2"/>
  <!-- 저손실 비선형 경로 -->
  <path d="M110,205 C250,228 520,228 660,208" fill="none" stroke="#4a7c59" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="385" y="243" text-anchor="middle" font-size="10.5" fill="#4a7c59" dy="-8">저손실 비선형 경로는 존재할 수 있음 (mode connectivity)</text>

  <!-- 점 -->
  <circle cx="110" cy="205" r="6" fill="#4a7c59"/>
  <text x="110" y="185" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a7c59">W_A</text>
  <circle cx="660" cy="208" r="6" fill="#4a7c59"/>
  <text x="660" y="188" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a7c59">W_B</text>
  <circle cx="385" cy="95" r="6" fill="#b3543a"/>
  <text x="385" y="75" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b3543a">단순 평균 모델 = 손실 장벽 위</text>

  <text x="385" y="47" text-anchor="middle" font-size="12" fill="#2b2823">두 모델이 서로 다른 분지에 있으면 선형 경로에 손실 장벽(loss barrier)이 생긴다</text>
</svg>
