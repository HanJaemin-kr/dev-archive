<svg width="480" height="280" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ah3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <rect width="480" height="280" fill="#f9fafb" rx="10"/>
  <text x="240" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">Precision–Recall Tradeoff</text>

  <!-- Plot area -->
  <rect x="70" y="35" width="330" height="200" fill="white" stroke="#e5e7eb" rx="4"/>

  <!-- Grid -->
  <line x1="70" y1="85" x2="400" y2="85" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="70" y1="135" x2="400" y2="135" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="70" y1="185" x2="400" y2="185" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="180" y1="35" x2="180" y2="235" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="290" y1="35" x2="290" y2="235" stroke="#f3f4f6" stroke-width="1"/>

  <!-- Precision curve (increases as threshold rises) -->
  <path d="M 70,215 C 120,210 180,190 250,150 C 310,115 360,72 400,38" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Recall curve (decreases as threshold rises) -->
  <path d="M 70,38 C 120,50 180,80 250,130 C 310,165 360,200 400,220" fill="none" stroke="#0891b2" stroke-width="2.5" stroke-linecap="round"/>

  <!-- F1 curve (∩ shape) -->
  <path d="M 70,215 C 120,140 180,75 230,65 C 275,57 340,100 400,210" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6,3" stroke-linecap="round"/>

  <!-- Optimal threshold marker at crossover -->
  <line x1="225" y1="35" x2="225" y2="235" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="225" cy="135" r="5" fill="#f59e0b"/>
  <text x="230" y="130" font-size="10" fill="#f59e0b" font-weight="bold">F1 최대</text>

  <!-- Axes -->
  <line x1="70" y1="235" x2="408" y2="235" stroke="#555" stroke-width="1.5" marker-end="url(#ah3)"/>
  <line x1="70" y1="235" x2="70" y2="30" stroke="#555" stroke-width="1.5" marker-end="url(#ah3)"/>

  <!-- X-axis label -->
  <text x="70" y="250" font-size="10" fill="#9ca3af">Low</text>
  <text x="390" y="250" text-anchor="end" font-size="10" fill="#9ca3af">High</text>
  <text x="235" y="266" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Threshold →</text>

  <!-- Y-axis label -->
  <text x="62" y="40" text-anchor="end" font-size="10" fill="#9ca3af">1.0</text>
  <text x="62" y="238" text-anchor="end" font-size="10" fill="#9ca3af">0</text>
  <text x="18" y="135" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold" transform="rotate(-90,18,135)">Score</text>

  <!-- Legend -->
  <line x1="90" y1="270" x2="110" y2="270" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="113" y="274" font-size="11" fill="#7c3aed">Precision</text>
  <line x1="190" y1="270" x2="210" y2="270" stroke="#0891b2" stroke-width="2.5"/>
  <text x="213" y="274" font-size="11" fill="#0891b2">Recall</text>
  <line x1="285" y1="270" x2="305" y2="270" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="5,3"/>
  <text x="308" y="274" font-size="11" fill="#16a34a">F1</text>
</svg>
