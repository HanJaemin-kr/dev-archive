<svg width="490" height="370" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="490" height="370" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="245" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f2937">Confusion Matrix</text>

  <!-- Predicted header -->
  <text x="300" y="60" text-anchor="middle" font-size="13" fill="#4b5563" font-weight="bold">예측값 (Predicted)</text>
  <text x="215" y="85" text-anchor="middle" font-size="12" fill="#6b7280">Positive (+)</text>
  <text x="375" y="85" text-anchor="middle" font-size="12" fill="#6b7280">Negative (−)</text>

  <!-- Actual header (rotated) -->
  <text x="38" y="225" text-anchor="middle" font-size="13" fill="#4b5563" font-weight="bold" transform="rotate(-90,38,225)">실제값 (Actual)</text>
  <text x="100" y="168" text-anchor="middle" font-size="12" fill="#6b7280">Positive (+)</text>
  <text x="100" y="290" text-anchor="middle" font-size="12" fill="#6b7280">Negative (−)</text>

  <!-- TP cell -->
  <rect x="135" y="98" width="155" height="115" rx="8" fill="#16a34a"/>
  <text x="212" y="145" text-anchor="middle" font-size="30" font-weight="bold" fill="white">TP</text>
  <text x="212" y="167" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.92)">True Positive</text>
  <text x="212" y="185" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)">정답 → 정답 ✓</text>

  <!-- FN cell -->
  <rect x="298" y="98" width="155" height="115" rx="8" fill="#dc2626"/>
  <text x="375" y="145" text-anchor="middle" font-size="30" font-weight="bold" fill="white">FN</text>
  <text x="375" y="167" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.92)">False Negative</text>
  <text x="375" y="185" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)">정답 → 오답 (Miss)</text>

  <!-- FP cell -->
  <rect x="135" y="221" width="155" height="115" rx="8" fill="#ea580c"/>
  <text x="212" y="268" text-anchor="middle" font-size="30" font-weight="bold" fill="white">FP</text>
  <text x="212" y="290" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.92)">False Positive</text>
  <text x="212" y="308" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)">오답 → 정답 (Alarm)</text>

  <!-- TN cell -->
  <rect x="298" y="221" width="155" height="115" rx="8" fill="#16a34a"/>
  <text x="375" y="268" text-anchor="middle" font-size="30" font-weight="bold" fill="white">TN</text>
  <text x="375" y="290" text-anchor="middle" font-size="11.5" fill="rgba(255,255,255,0.92)">True Negative</text>
  <text x="375" y="308" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.78)">오답 → 오답 ✓</text>

  <!-- Divider lines -->
  <line x1="288" y1="95" x2="288" y2="340" stroke="#f9fafb" stroke-width="3"/>
  <line x1="132" y1="210" x2="458" y2="210" stroke="#f9fafb" stroke-width="3"/>

  <!-- Formula hint -->
  <text x="245" y="355" text-anchor="middle" font-size="10" fill="#9ca3af">Precision = TP/(TP+FP)  ·  Recall = TP/(TP+FN)  ·  Accuracy = (TP+TN)/Total</text>
</svg>
