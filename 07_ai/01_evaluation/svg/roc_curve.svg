<svg width="430" height="370" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
  </defs>

  <rect width="430" height="370" fill="#f9fafb" rx="10"/>

  <!-- Title -->
  <text x="215" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">ROC Curve</text>

  <!-- Plot area background -->
  <rect x="70" y="35" width="310" height="265" fill="white" stroke="#e5e7eb" rx="4"/>

  <!-- Grid lines -->
  <line x1="70" y1="300" x2="380" y2="300" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="70" y1="234" x2="380" y2="234" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="70" y1="168" x2="380" y2="168" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="70" y1="102" x2="380" y2="102" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="70" y1="36" x2="380" y2="36" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="147" y1="35" x2="147" y2="300" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="225" y1="35" x2="225" y2="300" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="302" y1="35" x2="302" y2="300" stroke="#e5e7eb" stroke-width="1"/>

  <!-- AUC fill area -->
  <path d="M 70,300 C 70,150 160,35 380,35 L 380,300 Z" fill="#3b82f6" opacity="0.12"/>

  <!-- Diagonal (random) -->
  <line x1="70" y1="300" x2="380" y2="35" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ROC Curve -->
  <path d="M 70,300 C 70,150 160,35 380,35" fill="none" stroke="#3b82f6" stroke-width="2.8" stroke-linecap="round"/>

  <!-- AUC annotation -->
  <text x="230" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#3b82f6">AUC ≈ 0.87</text>

  <!-- Random label -->
  <text x="295" y="152" font-size="10" fill="#9ca3af" transform="rotate(-40,295,152)">Random (0.5)</text>

  <!-- Optimal point marker -->
  <circle cx="117" cy="102" r="5" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="125" y="97" font-size="10" fill="#f59e0b">Best Threshold</text>

  <!-- Axes (drawn on top) -->
  <line x1="70" y1="300" x2="385" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="70" y1="300" x2="70" y2="30" stroke="#555" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- X-axis ticks & labels -->
  <text x="70" y="315" text-anchor="middle" font-size="10" fill="#6b7280">0</text>
  <text x="147" y="315" text-anchor="middle" font-size="10" fill="#6b7280">0.25</text>
  <text x="225" y="315" text-anchor="middle" font-size="10" fill="#6b7280">0.5</text>
  <text x="302" y="315" text-anchor="middle" font-size="10" fill="#6b7280">0.75</text>
  <text x="380" y="315" text-anchor="middle" font-size="10" fill="#6b7280">1.0</text>
  <text x="225" y="335" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">FPR (False Positive Rate)</text>

  <!-- Y-axis ticks & labels -->
  <text x="62" y="304" text-anchor="end" font-size="10" fill="#6b7280">0</text>
  <text x="62" y="238" text-anchor="end" font-size="10" fill="#6b7280">0.25</text>
  <text x="62" y="172" text-anchor="end" font-size="10" fill="#6b7280">0.5</text>
  <text x="62" y="106" text-anchor="end" font-size="10" fill="#6b7280">0.75</text>
  <text x="62" y="40" text-anchor="end" font-size="10" fill="#6b7280">1.0</text>
  <text x="18" y="168" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold" transform="rotate(-90,18,168)">TPR (Recall)</text>

  <!-- Endpoint dots -->
  <circle cx="70" cy="300" r="4" fill="#3b82f6"/>
  <circle cx="380" cy="35" r="4" fill="#3b82f6"/>

  <!-- Legend -->
  <line x1="85" y1="350" x2="110" y2="350" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="114" y="354" font-size="11" fill="#3b82f6">Good Model</text>
  <line x1="215" y1="350" x2="240" y2="350" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="244" y="354" font-size="11" fill="#9ca3af">Random</text>
</svg>
