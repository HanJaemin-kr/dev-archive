<svg viewBox="0 0 860 260" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>LightGBM 구조</title>
  <desc>트리를 순차적으로 만들며 각 트리가 이전까지의 예측 오차(잔차)를 학습하고, 작은 학습률로 예측에 더해 나간다.</desc>
  <rect x="0" y="0" width="860" height="260" rx="14" fill="#faf9f6"/>
  <g transform="translate(20,60)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="none" stroke="#c9c4ba"/>
    <circle cx="65" cy="16" r="6" fill="#c2683f"/><circle cx="42" cy="46" r="6" fill="#c2683f"/><circle cx="90" cy="46" r="6" fill="#c2683f"/>
    <circle cx="90" cy="76" r="5" fill="#c2683f"/><circle cx="112" cy="76" r="5" fill="#c2683f"/>
    <line x1="65" y1="16" x2="42" y2="46" stroke="#c2683f"/><line x1="65" y1="16" x2="90" y2="46" stroke="#c2683f"/><line x1="90" y1="46" x2="90" y2="76" stroke="#c2683f"/><line x1="90" y1="46" x2="112" y2="76" stroke="#c2683f"/>
    <text x="65" y="-8" text-anchor="middle" font-size="11" font-weight="700" fill="#6b655c">Tree 1</text>
  </g>
  <g transform="translate(255,60)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="none" stroke="#c9c4ba"/>
    <circle cx="65" cy="16" r="6" fill="#c2683f"/><circle cx="42" cy="46" r="6" fill="#c2683f"/><circle cx="90" cy="46" r="6" fill="#c2683f"/>
    <circle cx="20" cy="76" r="5" fill="#c2683f"/><circle cx="60" cy="76" r="5" fill="#c2683f"/>
    <line x1="65" y1="16" x2="42" y2="46" stroke="#c2683f"/><line x1="65" y1="16" x2="90" y2="46" stroke="#c2683f"/><line x1="42" y1="46" x2="20" y2="76" stroke="#c2683f"/><line x1="42" y1="46" x2="60" y2="76" stroke="#c2683f"/>
    <text x="65" y="-8" text-anchor="middle" font-size="11" font-weight="700" fill="#6b655c">Tree 2</text>
  </g>
  <g transform="translate(490,60)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="none" stroke="#c9c4ba"/>
    <circle cx="65" cy="16" r="6" fill="#c2683f"/><circle cx="42" cy="46" r="6" fill="#c2683f"/><circle cx="90" cy="46" r="6" fill="#c2683f"/>
    <circle cx="90" cy="76" r="5" fill="#c2683f"/><circle cx="112" cy="76" r="5" fill="#c2683f"/>
    <line x1="65" y1="16" x2="42" y2="46" stroke="#c2683f"/><line x1="65" y1="16" x2="90" y2="46" stroke="#c2683f"/><line x1="90" y1="46" x2="90" y2="76" stroke="#c2683f"/><line x1="90" y1="46" x2="112" y2="76" stroke="#c2683f"/>
    <text x="65" y="-8" text-anchor="middle" font-size="11" font-weight="700" fill="#6b655c">Tree N</text>
  </g>
  <g stroke="#c2683f" stroke-width="1.8" fill="none" marker-end="url(#gbarrow)">
    <path d="M150 105 L 250 105"/><path d="M385 105 L 485 105"/>
  </g>
  <path d="M625 105 L 660 105" stroke="#c2683f" stroke-width="1.8" fill="none" stroke-dasharray="4 4"/>
  <text x="200" y="95" text-anchor="middle" font-size="11" fill="#c2683f">잔차 →</text>
  <text x="435" y="95" text-anchor="middle" font-size="11" fill="#c2683f">잔차 →</text>
  <text x="672" y="110" font-size="12" fill="#6b655c">···</text>
  <defs>
    <marker id="gbarrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#c2683f"/></marker>
  </defs>
  <rect x="700" y="60" width="140" height="90" rx="8" fill="#c2683f" opacity="0.15" stroke="#c2683f"/>
  <text x="770" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#2b2823">누적 합</text>
  <text x="770" y="116" text-anchor="middle" font-size="10.5" fill="#6b655c">F₀+η·T₁+η·T₂…</text>
  <text x="770" y="132" text-anchor="middle" font-size="11" fill="#6b655c">= 최종 예측</text>
  <text x="20" y="185" font-size="11" fill="#6b655c">각 트리: 오차가 가장 큰 리프를 우선 쪼개는 <tspan font-weight="700" fill="#2b2823">leaf-wise</tspan> 성장 → 깊고 비대칭</text>
  <text x="20" y="205" font-size="11" fill="#6b655c">η(학습률)로 조금씩만 반영해 과적합 억제</text>
</svg>
