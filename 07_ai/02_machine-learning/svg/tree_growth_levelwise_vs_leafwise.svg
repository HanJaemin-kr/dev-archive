<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
  <title>level-wise vs leaf-wise 트리 성장</title>
  <desc>level-wise는 같은 깊이 노드를 고르게 분할해 균형 트리, leaf-wise는 손실이 큰 리프부터 우선 분할해 깊고 비대칭 트리가 된다.</desc>
  <rect x="0" y="0" width="760" height="250" rx="14" fill="#faf9f6"/>

  <!-- LEFT: level-wise -->
  <text x="180" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2823">Level-wise (균형)</text>
  <g stroke="#4a7c59" stroke-width="1.6">
    <line x1="180" y1="60" x2="110" y2="120"/><line x1="180" y1="60" x2="250" y2="120"/>
    <line x1="110" y1="120" x2="75" y2="185"/><line x1="110" y1="120" x2="145" y2="185"/>
    <line x1="250" y1="120" x2="215" y2="185"/><line x1="250" y1="120" x2="285" y2="185"/>
  </g>
  <g fill="#4a7c59">
    <circle cx="180" cy="60" r="10"/><circle cx="110" cy="120" r="10"/><circle cx="250" cy="120" r="10"/>
    <circle cx="75" cy="185" r="9"/><circle cx="145" cy="185" r="9"/><circle cx="215" cy="185" r="9"/><circle cx="285" cy="185" r="9"/>
  </g>
  <text x="180" y="225" text-anchor="middle" font-size="11" fill="#6b655c">얕고 대칭 · 과적합에 강함 (XGBoost 기본)</text>

  <!-- divider -->
  <line x1="380" y1="45" x2="380" y2="210" stroke="#e0dbd2" stroke-width="1.5"/>

  <!-- RIGHT: leaf-wise -->
  <text x="575" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#2b2823">Leaf-wise (LightGBM)</text>
  <g stroke="#c2683f" stroke-width="1.6">
    <line x1="575" y1="55" x2="505" y2="110"/><line x1="575" y1="55" x2="655" y2="110"/>
    <line x1="505" y1="110" x2="465" y2="165"/><line x1="505" y1="110" x2="555" y2="165"/>
    <line x1="555" y1="165" x2="515" y2="210"/><line x1="555" y1="165" x2="600" y2="210"/>
  </g>
  <g fill="#c2683f">
    <circle cx="575" cy="55" r="10"/><circle cx="505" cy="110" r="10"/><circle cx="655" cy="110" r="9" opacity="0.4"/>
    <circle cx="465" cy="165" r="9" opacity="0.4"/><circle cx="555" cy="165" r="10"/><circle cx="515" cy="210" r="9"/><circle cx="600" cy="210" r="9"/>
  </g>
  <text x="670" y="100" font-size="10.5" fill="#6b655c">멈춤</text>
  <text x="405" y="160" font-size="10.5" fill="#6b655c">멈춤</text>
  <text x="575" y="240" text-anchor="middle" font-size="11" fill="#6b655c">이득 큰 곳만 깊게 · 정확하나 과적합 위험</text>
</svg>
