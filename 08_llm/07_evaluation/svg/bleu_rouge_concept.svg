<svg width="540" height="310" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <rect width="540" height="310" fill="#f9fafb" rx="10"/>
  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">BLEU vs ROUGE 개념 비교</text>

  <!-- BLEU section -->
  <rect x="15" y="40" width="250" height="200" rx="8" fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">BLEU (Precision 기반)</text>
  <text x="140" y="78" text-anchor="middle" font-size="10" fill="#6b7280">생성 텍스트 → 참조 텍스트 방향</text>

  <!-- Word boxes: Hypothesis -->
  <text x="28" y="98" font-size="10" fill="#374151" font-weight="bold">Hypothesis:</text>
  <rect x="28" y="103" width="38" height="20" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="47" y="118" text-anchor="middle" font-size="10" fill="#1d4ed8">the</text>
  <rect x="70" y="103" width="38" height="20" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="89" y="118" text-anchor="middle" font-size="10" fill="#1d4ed8">cat</text>
  <rect x="112" y="103" width="38" height="20" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
  <text x="131" y="118" text-anchor="middle" font-size="10" fill="#ea580c">ran</text>
  <rect x="154" y="103" width="38" height="20" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="173" y="118" text-anchor="middle" font-size="10" fill="#1d4ed8">fast</text>

  <!-- Match arrows -->
  <line x1="47" y1="123" x2="47" y2="148" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="89" y1="123" x2="89" y2="148" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="173" y1="123" x2="173" y2="148" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- Word boxes: Reference -->
  <text x="28" y="145" font-size="10" fill="#374151" font-weight="bold">Reference:</text>
  <rect x="28" y="150" width="38" height="20" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="47" y="165" text-anchor="middle" font-size="10" fill="#1d4ed8">the</text>
  <rect x="70" y="150" width="38" height="20" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="89" y="165" text-anchor="middle" font-size="10" fill="#1d4ed8">cat</text>
  <rect x="112" y="150" width="38" height="20" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="131" y="165" text-anchor="middle" font-size="10" fill="#6b7280">sat</text>
  <rect x="154" y="150" width="38" height="20" rx="4" fill="#bfdbfe" stroke="#3b82f6" stroke-width="1"/>
  <text x="173" y="165" text-anchor="middle" font-size="10" fill="#1d4ed8">fast</text>

  <!-- BLEU formula -->
  <text x="28" y="195" font-size="10" fill="#374151">매칭 토큰: 3/4 → Precision = 0.75</text>
  <text x="28" y="210" font-size="10" fill="#374151">+ Brevity Penalty (길이 패널티)</text>
  <text x="28" y="228" font-size="11" fill="#1d4ed8" font-weight="bold">BLEU = BP × exp(Σ wₙ log pₙ)</text>

  <!-- ROUGE section -->
  <rect x="275" y="40" width="250" height="200" rx="8" fill="white" stroke="#ef4444" stroke-width="1.5"/>
  <text x="400" y="62" text-anchor="middle" font-size="13" font-weight="bold" fill="#b91c1c">ROUGE (Recall 기반)</text>
  <text x="400" y="78" text-anchor="middle" font-size="10" fill="#6b7280">참조 텍스트 → 생성 텍스트 방향</text>

  <!-- Reference words -->
  <text x="288" y="98" font-size="10" fill="#374151" font-weight="bold">Reference:</text>
  <rect x="288" y="103" width="38" height="20" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="307" y="118" text-anchor="middle" font-size="10" fill="#b91c1c">the</text>
  <rect x="330" y="103" width="38" height="20" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="349" y="118" text-anchor="middle" font-size="10" fill="#b91c1c">cat</text>
  <rect x="372" y="103" width="38" height="20" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="391" y="118" text-anchor="middle" font-size="10" fill="#6b7280">sat</text>
  <rect x="414" y="103" width="38" height="20" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="433" y="118" text-anchor="middle" font-size="10" fill="#b91c1c">fast</text>

  <line x1="307" y1="123" x2="307" y2="148" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="349" y1="123" x2="349" y2="148" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>
  <line x1="433" y1="123" x2="433" y2="148" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="3,2"/>

  <!-- Hypothesis words -->
  <text x="288" y="145" font-size="10" fill="#374151" font-weight="bold">Hypothesis:</text>
  <rect x="288" y="150" width="38" height="20" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="307" y="165" text-anchor="middle" font-size="10" fill="#b91c1c">the</text>
  <rect x="330" y="150" width="38" height="20" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="349" y="165" text-anchor="middle" font-size="10" fill="#b91c1c">cat</text>
  <rect x="372" y="150" width="38" height="20" rx="4" fill="#fed7aa" stroke="#ea580c" stroke-width="1"/>
  <text x="391" y="165" text-anchor="middle" font-size="10" fill="#ea580c">ran</text>
  <rect x="414" y="150" width="38" height="20" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="433" y="165" text-anchor="middle" font-size="10" fill="#b91c1c">fast</text>

  <!-- ROUGE formula -->
  <text x="288" y="195" font-size="10" fill="#374151">참조에서 매칭: 3/4 → Recall = 0.75</text>
  <text x="288" y="210" font-size="10" fill="#374151">종류: ROUGE-1 · ROUGE-2 · ROUGE-L</text>
  <text x="288" y="228" font-size="11" fill="#b91c1c" font-weight="bold">ROUGE-N = matched N-grams / ref N-grams</text>

  <!-- Bottom summary -->
  <rect x="15" y="250" width="510" height="48" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="270" y="269" text-anchor="middle" font-size="11" fill="#0369a1" font-weight="bold">핵심 차이: BLEU = Precision (생성 품질), ROUGE = Recall (참조 커버리지)</text>
  <text x="270" y="287" text-anchor="middle" font-size="10" fill="#0891b2">두 지표 모두 표면적 n-gram 매칭 → 의미·문맥 파악 불가 → BERTScore, LLM-as-Judge로 보완</text>
</svg>
