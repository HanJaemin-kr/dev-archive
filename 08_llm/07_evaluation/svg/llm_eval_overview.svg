<svg width="580" height="310" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect width="580" height="310" fill="#f9fafb" rx="10"/>
  <text x="290" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2937">LLM 평가 방법 분류</text>

  <!-- Left: Input -->
  <rect x="15" y="115" width="110" height="80" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="70" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">LLM</text>
  <text x="70" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">Output</text>
  <text x="70" y="182" text-anchor="middle" font-size="10" fill="#6366f1">(생성된 텍스트)</text>

  <!-- Center boxes -->
  <!-- Statistical -->
  <rect x="165" y="40" width="230" height="68" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="280" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">통계 기반 (Statistical)</text>
  <text x="280" y="83" text-anchor="middle" font-size="11" fill="#2563eb">BLEU · ROUGE · Perplexity · METEOR</text>
  <text x="280" y="99" text-anchor="middle" font-size="10" fill="#60a5fa">빠름 · 재현 가능 · 표면적 유사도만 측정</text>

  <!-- Model-based -->
  <rect x="165" y="121" width="230" height="68" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">모델 기반 (Model-Based)</text>
  <text x="280" y="164" text-anchor="middle" font-size="11" fill="#be185d">BERTScore · LLM-as-a-Judge</text>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#f472b6">의미적 유사도 · 유연 · 비용 ↑</text>

  <!-- Human -->
  <rect x="165" y="202" width="230" height="68" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="280" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">인간 평가 (Human Eval)</text>
  <text x="280" y="245" text-anchor="middle" font-size="11" fill="#16a34a">정확성 · 유창성 · 유용성 · 안전성</text>
  <text x="280" y="261" text-anchor="middle" font-size="10" fill="#4ade80">가장 신뢰 가능 · 느림 · 비용 높음</text>

  <!-- Right: Output -->
  <rect x="450" y="115" width="115" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="507" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">평가 결과</text>
  <text x="507" y="166" text-anchor="middle" font-size="11" fill="#b45309">Score / Rank</text>
  <text x="507" y="183" text-anchor="middle" font-size="10" fill="#d97706">Pass / Fail</text>

  <!-- Arrows: Input → Center boxes -->
  <line x1="125" y1="145" x2="163" y2="85" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="125" y1="155" x2="163" y2="155" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="125" y1="165" x2="163" y2="228" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrows: Center boxes → Output -->
  <line x1="395" y1="85" x2="448" y2="140" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="395" y1="155" x2="448" y2="155" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="395" y1="228" x2="448" y2="172" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Benchmark tag -->
  <rect x="165" y="285" width="230" height="22" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="280" y="300" text-anchor="middle" font-size="10" fill="#15803d">벤치마크: MMLU · HumanEval · MT-Bench · HellaSwag</text>
</svg>
