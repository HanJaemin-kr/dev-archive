<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="h" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">쉘 앤 튜브 열교환기 단면도</text>
  <text x="320" y="48" text-anchor="middle" font-size="12" fill="#777">두 유체가 벽을 사이에 두고 열만 주고받음 (안 섞임)</text>

  <!-- channel heads -->
  <path d="M110,140 Q75,140 75,200 Q75,260 110,260 Z" fill="#c2c8cf" stroke="#333" stroke-width="2.5"/>
  <path d="M510,140 Q545,140 545,200 Q545,260 510,260 Z" fill="#c2c8cf" stroke="#333" stroke-width="2.5"/>

  <!-- shell body -->
  <rect x="110" y="130" width="400" height="140" rx="8" fill="#dfe4ea" stroke="#333" stroke-width="3"/>

  <!-- tube sheets -->
  <line x1="118" y1="132" x2="118" y2="268" stroke="#555" stroke-width="4"/>
  <line x1="502" y1="132" x2="502" y2="268" stroke="#555" stroke-width="4"/>

  <!-- tubes (tube-side hot fluid) -->
  <g stroke="#e8543a" stroke-width="4">
    <line x1="118" y1="150" x2="502" y2="150"/>
    <line x1="118" y1="172" x2="502" y2="172"/>
    <line x1="118" y1="200" x2="502" y2="200"/>
    <line x1="118" y1="228" x2="502" y2="228"/>
    <line x1="118" y1="250" x2="502" y2="250"/>
  </g>

  <!-- baffles (force shell-side zigzag) -->
  <line x1="190" y1="130" x2="190" y2="235" stroke="#7a8290" stroke-width="4"/>
  <line x1="270" y1="165" x2="270" y2="270" stroke="#7a8290" stroke-width="4"/>
  <line x1="350" y1="130" x2="350" y2="235" stroke="#7a8290" stroke-width="4"/>
  <line x1="430" y1="165" x2="430" y2="270" stroke="#7a8290" stroke-width="4"/>

  <!-- tube-side flow (hot) in/out -->
  <line x1="30" y1="200" x2="72" y2="200" stroke="#e8543a" stroke-width="2.5" marker-end="url(#h)"/>
  <text x="20" y="185" font-size="12" fill="#e8543a" font-weight="bold">뜨거운 유체 입구</text>
  <text x="20" y="228" font-size="11" fill="#e8543a">(튜브측)</text>
  <line x1="548" y1="200" x2="600" y2="200" stroke="#e8543a" stroke-width="2.5" marker-end="url(#h)"/>
  <text x="556" y="185" font-size="12" fill="#e8543a">출구(식음)</text>

  <!-- shell-side flow (cold): in bottom-right, out top-left -->
  <line x1="450" y1="320" x2="450" y2="272" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#h)"/>
  <text x="400" y="340" font-size="12" fill="#1e88e5" font-weight="bold">차가운 유체 입구 (쉘측)</text>
  <line x1="170" y1="128" x2="170" y2="82" stroke="#1e88e5" stroke-width="2.5" marker-end="url(#h)"/>
  <text x="120" y="76" font-size="12" fill="#1e88e5">출구(데워짐)</text>

  <!-- labels -->
  <line x1="300" y1="200" x2="300" y2="310" stroke="#333" stroke-width="1.2" marker-end="url(#h)"/>
  <text x="230" y="325" font-size="11.5" fill="#e8543a">튜브 다발(관 속=뜨거운 유체)</text>

  <text x="196" y="125" font-size="11.5" fill="#7a8290">배플(baffle): 흐름을 지그재그로 → 접촉↑</text>

  <text x="320" y="368" text-anchor="middle" font-size="11.5" fill="#555">두 유체를 반대 방향으로 흘리면(향류) 열교환 효율이 가장 높다</text>
</svg>
