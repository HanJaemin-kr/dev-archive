<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">연속주조기(Continuous Caster) 개략도</text>

  <!-- 1. Ladle -->
  <path d="M110,55 L230,55 L215,120 L125,120 Z" fill="#9aa0a8" stroke="#333" stroke-width="2.5"/>
  <path d="M128,72 L212,72 L206,116 L134,116 Z" fill="#ff8c1a"/>
  <text x="170" y="48" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">레이들(Ladle)</text>
  <!-- pour stream ladle->tundish -->
  <rect x="166" y="120" width="8" height="35" fill="#ff8c1a"/>

  <!-- 2. Tundish -->
  <path d="M95,158 L280,158 L262,205 L113,205 Z" fill="#9aa0a8" stroke="#333" stroke-width="2.5"/>
  <path d="M108,170 L267,170 L255,200 L120,200 Z" fill="#ff8c1a"/>
  <text x="300" y="180" font-size="12.5" font-weight="bold" fill="#333">턴디시(Tundish)</text>
  <text x="300" y="196" font-size="11" fill="#777">완충 저장 · 유량 조절</text>
  <!-- pour stream tundish->mold -->
  <rect x="184" y="205" width="8" height="35" fill="#ff8c1a"/>

  <!-- 3. Mold (water-cooled) -->
  <rect x="158" y="242" width="60" height="70" fill="none" stroke="#1e88e5" stroke-width="6"/>
  <text x="120" y="235" font-size="12.5" font-weight="bold" fill="#1e88e5">몰드(Mold)</text>
  <text x="70" y="285" font-size="11" fill="#1e88e5">수랭 주형</text>
  <text x="70" y="299" font-size="11" fill="#1e88e5">겉만 응고</text>

  <!-- strand: solid shell (gray) L-shaped path -->
  <path d="M188,250 L188,360 Q188,430 258,430 L560,430" fill="none" stroke="#8a9099" stroke-width="28" stroke-linecap="butt"/>
  <!-- strand: still-molten core near top (orange), fades along curve -->
  <path d="M188,250 L188,360 Q188,420 240,428" fill="none" stroke="#ff8c1a" stroke-width="14" stroke-linecap="round"/>

  <!-- guide rollers (pairs) -->
  <g fill="#3a3f47">
    <circle cx="168" cy="290" r="7"/><circle cx="208" cy="290" r="7"/>
    <circle cx="168" cy="330" r="7"/><circle cx="208" cy="330" r="7"/>
    <circle cx="300" cy="410" r="7"/><circle cx="300" cy="450" r="7"/>
    <circle cx="370" cy="410" r="7"/><circle cx="370" cy="450" r="7"/>
    <circle cx="440" cy="410" r="7"/><circle cx="440" cy="450" r="7"/>
    <circle cx="510" cy="410" r="7"/><circle cx="510" cy="450" r="7"/>
  </g>
  <text x="300" y="500" text-anchor="middle" font-size="12" fill="#3a3f47">가이드 롤(strand 지지·인발)</text>

  <!-- secondary cooling water sprays -->
  <g stroke="#1e88e5" stroke-width="1.6">
    <line x1="150" y1="345" x2="168" y2="360"/><line x1="150" y1="360" x2="168" y2="370"/>
    <line x1="228" y1="392" x2="248" y2="405"/><line x1="240" y1="380" x2="256" y2="398"/>
  </g>
  <text x="30" y="345" font-size="12.5" fill="#1e88e5" font-weight="bold">2차 냉각</text>
  <text x="30" y="360" font-size="11" fill="#1e88e5">(물 분사로</text>
  <text x="30" y="374" font-size="11" fill="#1e88e5">속까지 응고)</text>

  <!-- cutting torch -->
  <polygon points="512,405 522,418 502,418" fill="#e8543a"/>
  <text x="512" y="398" text-anchor="middle" font-size="12" fill="#e8543a" font-weight="bold">절단(토치)</text>

  <!-- slab output -->
  <rect x="560" y="416" width="60" height="28" fill="#8a9099" stroke="#333" stroke-width="2"/>
  <line x1="575" y1="470" x2="595" y2="470" stroke="#333" stroke-width="1.5"/>
  <text x="590" y="490" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333">슬래브</text>
  <text x="590" y="505" text-anchor="middle" font-size="11" fill="#777">(반제품)</text>

  <!-- flow direction hint -->
  <line x1="120" y1="130" x2="120" y2="215" stroke="#bbb" stroke-width="1.5" marker-end="url(#a2)"/>

  <text x="320" y="560" text-anchor="middle" font-size="12" fill="#555">쇳물을 끊김 없이 부어 굳히며 뽑아낸다 → 겉(몰드)부터 속(2차 냉각)까지 응고 → 길게 뽑아 절단</text>
  <text x="320" y="580" text-anchor="middle" font-size="11" fill="#888">단면 모양에 따라 슬래브(판)·블룸·빌릿(봉/막대)으로 구분</text>
</svg>
