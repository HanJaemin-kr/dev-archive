<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" font-family="'Malgun Gothic','Segoe UI',sans-serif">
  <defs>
    <marker id="d" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#333"/>
    </marker>
    <linearGradient id="colTemp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#cfe3f0"/>
      <stop offset="100%" stop-color="#ffb27a"/>
    </linearGradient>
  </defs>

  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">상압 증류탑(CDU) 개략도</text>
  <text x="280" y="50" text-anchor="middle" font-size="12" fill="#777">끓는점 차이로 원유를 여러 유분으로 분리</text>

  <!-- column body -->
  <rect x="220" y="80" width="100" height="470" rx="14" fill="url(#colTemp)" stroke="#333" stroke-width="3"/>

  <!-- trays -->
  <g stroke="#6b7785" stroke-width="1.5">
    <line x1="228" y1="130" x2="312" y2="130"/>
    <line x1="228" y1="175" x2="312" y2="175"/>
    <line x1="228" y1="220" x2="312" y2="220"/>
    <line x1="228" y1="265" x2="312" y2="265"/>
    <line x1="228" y1="310" x2="312" y2="310"/>
    <line x1="228" y1="360" x2="312" y2="360"/>
    <line x1="228" y1="410" x2="312" y2="410"/>
    <line x1="228" y1="460" x2="312" y2="460"/>
    <line x1="228" y1="505" x2="312" y2="505"/>
  </g>

  <!-- temperature scale -->
  <text x="150" y="95"  font-size="12" fill="#3d6f95">≈ 30℃ (탑정, 차가움)</text>
  <text x="150" y="545" font-size="12" fill="#c0392b">≈ 350℃ (탑저, 뜨거움)</text>

  <!-- furnace + feed -->
  <rect x="60" y="470" width="70" height="55" rx="4" fill="#e8543a" stroke="#333" stroke-width="2"/>
  <text x="95" y="503" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">가열로</text>
  <line x1="130" y1="497" x2="218" y2="510" stroke="#333" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="60" y="455" font-size="11.5" fill="#333">원유 투입 (가열)</text>

  <!-- product draw-offs (top to bottom) -->
  <!-- top gas -->
  <line x1="270" y1="80" x2="270" y2="55" stroke="#333" stroke-width="2.5"/>
  <line x1="270" y1="55" x2="410" y2="55" stroke="#333" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="416" y="59" font-size="12" fill="#333">탑정가스 · LPG</text>

  <line x1="320" y1="152" x2="410" y2="152" stroke="#333" stroke-width="2" marker-end="url(#d)"/>
  <text x="416" y="156" font-size="12" fill="#333">나프타 (가솔린 원료)</text>

  <line x1="320" y1="242" x2="410" y2="242" stroke="#333" stroke-width="2" marker-end="url(#d)"/>
  <text x="416" y="246" font-size="12" fill="#333">등유 (항공유)</text>

  <line x1="320" y1="385" x2="410" y2="385" stroke="#333" stroke-width="2" marker-end="url(#d)"/>
  <text x="416" y="389" font-size="12" fill="#333">경유 (디젤)</text>

  <line x1="320" y1="480" x2="410" y2="480" stroke="#333" stroke-width="2" marker-end="url(#d)"/>
  <text x="416" y="484" font-size="12" fill="#333">중유</text>

  <!-- bottom residue -->
  <line x1="270" y1="550" x2="270" y2="580" stroke="#333" stroke-width="2.5"/>
  <line x1="270" y1="580" x2="410" y2="580" stroke="#333" stroke-width="2.5" marker-end="url(#d)"/>
  <text x="416" y="584" font-size="12" fill="#333">잔사유 (아스팔트 등)</text>

  <text x="280" y="620" text-anchor="middle" font-size="11.5" fill="#555">가벼운(끓는점 낮은) 성분은 위로 올라가 먼저 응축, 무거운 성분은 아래에 남는다</text>
</svg>
