name: Velog Sync

on:
  push:
    branches: [main]
    paths: ['**/*.md']

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed MD files
        id: changed
        run: |
          FILES=$(git diff-tree --no-commit-id -r --name-only HEAD -- '*.md' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Set up Python
        if: steps.changed.outputs.files != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.changed.outputs.files != ''
        run: pip install requests

      - name: Sync to Velog
        if: steps.changed.outputs.files != ''
        env:
          VELOG_TOKEN: ${{ secrets.VELOG_TOKEN }}
        run: python scripts/velog_sync.py ${{ steps.changed.outputs.files }}

      - name: Commit updated state
        if: steps.changed.outputs.files != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add velog_state.json
          git diff --staged --quiet || git commit -m "chore: update velog_state.json" && git push
